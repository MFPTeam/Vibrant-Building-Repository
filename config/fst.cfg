# Configuration file

general {
    # Whether Blaze Powder acts as Bonemeal on Nether Warts
    B:enable_bpb=false

    # Whether Horse Armor crafting recipes are enabled.
    B:enable_cha=false

    # Whether Farmland can decay in to Red Sand after time
    B:enable_f2s=false

    # Whether Magma Cubes can grow from absorbing Magma
    B:enable_mcg=true

    # Whether Falling Blocks will randomly trigger around the player
    B:enable_rfb=true

    # Whether Rockslides are enabled
    B:enable_rrs=false

    # Whether Real Stone Tool recipes are enabled, and default ones disabled.
    B:enable_rst=true

    # Whether Slimes absorb Magma to become Magma Cubes
    B:enable_s2m=true

    # Whether Silverfish Eggs have the same break speed as stone
    B:enable_seb=true

    # Whether Silverfish Eggs get generated in the world as ore
    B:enable_ses=true

    # If enabled, spawners can be mined with a silk touch pickaxe.
    B:enable_silk_spawners=false

    # If enabled, the stair recipes will be replaced with recipes that output 8 Stairs instead of 4.
    B:enable_stair_recipe_replacement=true

    # Set this to 0 for unlimited growth of Magma Cubes. Otherwise, this is the max Magma Cube size from Magma Cube Growth. Does not shrink Magma Cubes that have already grown.
    I:mcg_limit=0
}


